name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: repo-level checks
        run: tests/run-tests.sh
      - name: time-awareness test suite
        run: utils/time-awareness/tests/run-tests.sh
      - name: html-deliverable test suite
        run: utils/html-deliverable/tests/run-tests.sh
      - name: evidence-first test suite
        run: utils/evidence-first/tests/run-tests.sh
      - name: html-interactive test suite
        run: utils/html-interactive/tests/run-tests.sh
      - name: live-qa test suite
        run: utils/live-qa/tests/run-tests.sh
